[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labbox"
version = "0.1.0"
description = "Local-first, zero-instrumentation recorder and differ for AI training experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LabBox contributors" }]
keywords = ["experiment-tracking", "reproducibility", "pytorch", "mlops", "local-first"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "psutil>=5.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "tomli-w>=1.1",
    "pyyaml>=6.0",
    "nvidia-ml-py>=12.535; sys_platform != 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.350",
]

[project.scripts]
labbox = "labbox.cli.main:main"

# [project.urls] is added once the public repository URL is known.

[tool.hatch.build.targets.wheel]
packages = ["src/labbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --color=no"
markers = [
    "gpu: requires a real NVIDIA GPU and driver (skipped by default)",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error::DeprecationWarning:labbox.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",   # typer.Option() in argument defaults is the framework's own idiom
    "RUF001",  # full-width punctuation is intentional in Chinese user-facing strings
    "RUF002",
    "RUF003",
    # Enums stay `(str, Enum)` rather than StrEnum: every call site already reads `.value`,
    # and switching would silently change f-string rendering across the report layer.
    "UP042",
    "SIM105",  # `try/except/pass` is clearer than contextlib.suppress at these call sites
]

[tool.ruff.lint.isort]
known-first-party = ["labbox"]

[tool.pyright]
# `tests/` is left out on purpose: pydantic coerces str -> enum and dict -> model in
# fixtures, which pyright cannot see through, so it produced ~40 false positives there.
# Tests are covered by `ruff check` and `pytest` instead; only library code is type-gated.
include = ["src", "examples"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUnusedExpression = false
